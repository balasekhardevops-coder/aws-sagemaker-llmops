name: Terraform Validate
on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap
          - terraform/identity
          - terraform/environments/dev
          - terraform/environments/qa
          - terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.0'
      # Normalize whitespace for validation; run terraform fmt locally before committing.
      - name: Normalize Terraform formatting
        run: terraform fmt -recursive terraform
      - name: Initialize without contacting an AWS state backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color
