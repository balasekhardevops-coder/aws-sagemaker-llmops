name: Terraform Promote QA or Prod
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Choose destination account
        required: true
        type: choice
        options:
          - qa
          - prod
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    uses: ./.github/workflows/terraform-reusable-deploy.yml
    with:
      target_environment: ${{ inputs.target_environment }}
      expected_account_id: ${{ inputs.target_environment == 'qa' && vars.AWS_ACCOUNT_QA || vars.AWS_ACCOUNT_PROD }}
      state_bucket: ${{ inputs.target_environment == 'qa' && vars.TF_STATE_BUCKET_QA || vars.TF_STATE_BUCKET_PROD }}
      plan_role_arn: ${{ inputs.target_environment == 'qa' && vars.AWS_PLAN_ROLE_QA || vars.AWS_PLAN_ROLE_PROD }}
      apply_role_arn: ${{ inputs.target_environment == 'qa' && vars.AWS_APPLY_ROLE_QA || vars.AWS_APPLY_ROLE_PROD }}
      aws_region: ap-south-1
