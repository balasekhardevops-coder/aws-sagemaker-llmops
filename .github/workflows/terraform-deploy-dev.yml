name: Terraform Deploy Dev
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    uses: ./.github/workflows/terraform-reusable-deploy.yml
    with:
      target_environment: dev
      expected_account_id: ${{ vars.AWS_ACCOUNT_DEV }}
      state_bucket: ${{ vars.TF_STATE_BUCKET_DEV }}
      plan_role_arn: ${{ vars.AWS_PLAN_ROLE_DEV }}
      apply_role_arn: ${{ vars.AWS_APPLY_ROLE_DEV }}
      aws_region: ap-south-1
